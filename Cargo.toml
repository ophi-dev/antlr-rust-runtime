[workspace]
members = [
    "crates/antlr-rust-runtime",
    "crates/antlr-rust-g4-parser",
    "crates/antlr-rust-rs-parser",
    "crates/antlr-rust-toml-parser",
    "crates/antlr-rust-codegen",
    "tests/antlr-rust-runtime-testsuite",
]
exclude = [
    # Benchmarks live outside the workspace so that the CodSpeed harness'
    # dependencies never unify features into the published crates.
    "benches",
    "tests/javascript-parity/dumper",
    "tests/kotlin-parity/dumper",
    "tests/typescript-parity/dumper",
]
resolver = "3"

[workspace.package]
# x-release-please-start-version
version = "0.35.0"
# x-release-please-end
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
license-file = "LICENSE"
repository = "https://github.com/ophi-dev/antlr-rust-runtime"
homepage = "https://github.com/ophi-dev/antlr-rust-runtime"

[workspace.dependencies]
# x-release-please-start-version
antlr-rust-runtime = { path = "crates/antlr-rust-runtime", version = "=0.35.0" }
antlr-rust-g4-parser = { path = "crates/antlr-rust-g4-parser", version = "=0.35.0" }
antlr-rust-rs-parser = { path = "crates/antlr-rust-rs-parser", version = "=0.35.0" }
antlr-rust-toml-parser = { path = "crates/antlr-rust-toml-parser", version = "=0.35.0" }
antlr-rust-codegen = { path = "crates/antlr-rust-codegen", version = "=0.35.0" }
# x-release-please-end
icu_properties = { version = "2.2.0", features = ["alloc"] }
insta = { version = "1", default-features = false }
memchr = "2"
thiserror = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_compatibility = { level = "warn", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -2 }
rust_2021_compatibility = { level = "warn", priority = -2 }
rust_2024_compatibility = { level = "warn", priority = -2 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -4 }
nursery = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_trait_access = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
get_unwrap = "warn"
if_not_else = "warn"
implicit_hasher = "allow"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
items_after_statements = "allow"
manual_assert = "warn"
manual_instant_elapsed = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
match_result_ok = "warn"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_raw_string_hashes = "allow"
negative_feature_names = "warn"
option_map_unit_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
question_mark = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_pub_crate = "allow"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
result_map_unit_fn = "warn"
semicolon_if_nothing_returned = "warn"
similar_names = "allow"
single_match_else = "allow"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
struct_excessive_bools = "allow"
too_many_lines = "deny"
type_repetition_in_bounds = "warn"
unnecessary_debug_formatting = "allow"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
unneeded_field_pattern = "warn"
unnested_or_patterns = "warn"
unseparated_literal_suffix = "warn"
unused_async = "warn"
unused_peekable = "warn"
unused_self = "allow"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_bit_mask = "warn"
wildcard_imports = "warn"
